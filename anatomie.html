<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}</style>
<script>window.SEMIO_URL="./";window.ATLAS_MODELS="";window.ATLAS_THUMBS=""</script>
<title>Corpus 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: scène 3D plein écran ; panneau d'outils à gauche, fiche de la structure à droite ; sur téléphone, tiroirs. */
:root{
  --bg:#eef1f4; --stage1:#eef2f5; --stage2:#b9c3cd; --panel:#ffffffee; --line:#cfd7df; --fg:#14202b; --mut:#5a6b7a;
  --accent:#0b7a8c; --accent-fg:#fff; --ok:#1d8a4e; --bad:#c23b3b; --chip:#e6ecf1; --cardbg:#ffffff;
  --display:'Space Grotesk',system-ui,sans-serif; --text:'Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1319;--stage1:#1b2630;--stage2:#090d12;--panel:#141c24ee;--line:#2a3743;--fg:#e8eef3;--mut:#93a4b3;--accent:#3fc1d3;--accent-fg:#06222a;--ok:#4cc784;--bad:#ef7070;--chip:#1f2a35;--cardbg:#141c24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1319;--stage1:#1b2630;--stage2:#090d12;--panel:#141c24ee;--line:#2a3743;--fg:#e8eef3;--mut:#93a4b3;--accent:#3fc1d3;--accent-fg:#06222a;--ok:#4cc784;--bad:#ef7070;--chip:#1f2a35;--cardbg:#141c24;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--text);font-size:14px;overflow:hidden}
#app{height:100%}
*{box-sizing:border-box}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--chip);border-radius:6px;padding:6px 10px}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.on,button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
#app{position:relative;height:100%;background:radial-gradient(ellipse at 50% 35%,var(--stage1),var(--stage2))}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.panel{position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:10px;backdrop-filter:blur(8px);display:flex;flex-direction:column;gap:10px;padding:12px}
#left{top:12px;left:max(16px,env(safe-area-inset-left,0px));width:270px;max-height:calc(100% - 24px);overflow:auto}
#right{top:12px;right:max(16px,env(safe-area-inset-right,0px));width:330px;max-height:calc(100% - 70px);overflow:auto}
h1{font-family:var(--display);font-size:20px;margin:0;letter-spacing:-.01em}
h1 small{display:block;font:400 12px var(--text);color:var(--mut);letter-spacing:0}
h2{font-family:var(--display);font-size:19px;margin:0;line-height:1.2;text-wrap:balance}
.lab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);font-weight:600}
.tabs{display:flex;gap:6px}.tabs button{flex:1;font-weight:600}
#q{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
#res{display:flex;flex-direction:column;max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:6px}
#res button{border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;text-align:left;padding:7px 9px}
#res button:hover{background:var(--chip)}#res small{color:var(--mut);display:block}
.layers{display:flex;flex-direction:column;gap:4px}
.layer{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;border:1px solid transparent;background:none;text-align:left;width:100%}
.layer i{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid var(--c);background:transparent}
button.layer.on{background:none;color:var(--fg);border-color:transparent}button.layer:hover{background:var(--chip)}.layer.on i{background:var(--c)}.layer:not(.on){color:var(--mut)}
.layer span{flex:1}.layer em{font-style:normal;color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:6px}
.en{color:var(--mut);font-style:italic}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chips span{background:var(--chip);border-radius:20px;padding:2px 9px;font-size:12px}
dl{margin:0;display:grid;gap:8px}dt{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:600}dd{margin:2px 0 0;line-height:1.45}
p{margin:0;line-height:1.5}
.mut{color:var(--mut)}
#views{position:absolute;bottom:calc(12px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:max-content;max-width:calc(100% - 32px)}
#credit{position:absolute;pointer-events:none;bottom:calc(4px + env(safe-area-inset-bottom,0px));right:max(16px,env(safe-area-inset-right,0px));font-size:10px;color:var(--mut);max-width:45%;text-align:right}
#load{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
#load>div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px;text-align:center}
#bar{height:4px;background:var(--chip);border-radius:2px;margin-top:8px;overflow:hidden;width:220px}#bar b{display:block;height:100%;background:var(--accent);width:0}
#tip{position:absolute;pointer-events:none;background:var(--fg);color:var(--bg);padding:3px 8px;border-radius:4px;font-size:12px;white-space:nowrap}
#qprompt{font-family:var(--display);font-size:18px;line-height:1.25}
#qfb{min-height:20px;font-weight:600}.ok{color:var(--ok)}.bad{color:var(--bad)}
#choices{display:flex;flex-direction:column;gap:6px}#choices button{text-align:left}
#choices button.good{background:var(--ok);color:#fff;border-color:var(--ok)}#choices button.wrong{background:var(--bad);color:#fff;border-color:var(--bad)}
#score{font-variant-numeric:tabular-nums}
#menuBtn{display:none}
@media (max-width:760px){
  #menuBtn{display:block;position:absolute;top:10px;left:max(16px,env(safe-area-inset-left,0px));z-index:3}
  #left{top:52px;width:min(290px,calc(100% - 32px));max-height:calc(100% - 120px);z-index:3}
  #left.closed{display:none}
  #right{top:auto;bottom:calc(56px + env(safe-area-inset-bottom,0px));left:max(16px,env(safe-area-inset-left,0px));width:auto;max-height:42%}
  #credit{display:none}
}
.seg{display:flex}.seg button{border-radius:0;margin-left:-1px}.seg button:first-child{border-radius:6px 0 0 6px;margin-left:0}.seg button:last-child{border-radius:0 6px 6px 0}
#femNote{font-size:12px}
#tools{position:absolute;top:12px;right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:6px;width:92px;z-index:2}
#tools button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;background:var(--panel);backdrop-filter:blur(8px);border-radius:8px}
#tools button span{font-size:9.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;line-height:1.15;text-align:center}
#tools button.on{background:var(--accent);color:var(--accent-fg)}
#tools button:disabled{opacity:.38;cursor:default;border-color:var(--line)}
#right{right:calc(max(16px,env(safe-area-inset-right,0px)) + 102px)}
#vpop{top:12px;right:calc(max(16px,env(safe-area-inset-right,0px)) + 102px);width:330px;z-index:4}
.vhead{display:flex;justify-content:space-between;align-items:center}
.vgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.vgrid button{padding:10px 4px;font-weight:600}
.chips .cnt{background:var(--accent);color:var(--accent-fg)}
@media (max-width:760px){#tools{width:50px;gap:4px}#tools button{padding:6px 0}#tools button span{display:none}#tools svg{width:22px;height:22px}
 #right{right:calc(max(16px,env(safe-area-inset-right,0px)) + 58px);bottom:calc(12px + env(safe-area-inset-bottom,0px))}
 #vpop{right:calc(max(16px,env(safe-area-inset-right,0px)) + 58px);left:max(16px,env(safe-area-inset-left,0px));width:auto;top:52px}}
#left>*,#right>*,#vpop>*,#explore>*,#quiz>*{flex-shrink:0}
#home{height:100%;overflow-y:auto;padding-block:14px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px}
.brand{font:700 22px var(--display);letter-spacing:-.01em}.brand small{display:block;font:400 12px var(--text);color:var(--mut);letter-spacing:0}
.hs{position:relative;flex:1 1 240px;min-width:0;max-width:460px}
#hq,#q{width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.reslist{display:flex;flex-direction:column;max-height:300px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
#hres{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:5;box-shadow:0 8px 24px #0003}
.reslist button{border:0;border-bottom:1px solid var(--line);border-radius:0;background:none;text-align:left;padding:7px 10px}
.reslist button:hover{background:var(--chip)}.reslist small{color:var(--mut);display:block}.pad{padding:8px 10px}
.ctl{margin-left:auto}
.hbody{display:grid;grid-template-columns:168px minmax(0,1fr);gap:22px;align-items:start}
#regions{position:sticky;top:0;display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px}
.reg{display:flex;align-items:center;gap:10px;justify-content:flex-start;text-align:left;border-color:transparent;background:none;padding:8px 10px;border-radius:8px;font-weight:600;color:var(--mut)}
.reg svg{flex:none;fill:var(--line)}
.reg.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}.reg.on svg{fill:color-mix(in srgb,var(--bg) 35%,transparent)}
.reg.on.r-body svg *,.reg.on.r-head .fh,.reg.on.r-trunk .ft,.reg.on.r-arm .fa,.reg.on.r-leg .fl{fill:var(--bg)}
#cat{display:flex;flex-direction:column;gap:22px;min-width:0}
#cat h2{font-size:17px;margin:0 0 10px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:12px}
.card{display:flex;flex-direction:column;background:var(--cardbg);border:1px solid var(--line);border-radius:12px;overflow:hidden;color:inherit;text-decoration:none;transition:transform .12s,border-color .12s}
.card:hover,.card:focus-visible{border-color:var(--accent);transform:translateY(-2px);outline:none}
.card img{display:block;width:100%;height:auto;aspect-ratio:8/9;object-fit:contain;background:radial-gradient(ellipse at 50% 40%,var(--stage1),var(--stage2))}
.ct{padding:9px 11px 11px;display:flex;flex-direction:column;gap:1px;border-top:1px solid var(--line)}
.ct b{font:600 12.5px var(--display);letter-spacing:.05em;text-transform:uppercase}.ct small{color:var(--mut);font-size:12px;min-height:1.2em}
#home #credit{position:static;max-width:none;text-align:left;font-size:11px;color:var(--mut)}
#home #femNote{font-size:12.5px;margin:0}
#vbar{position:absolute;top:12px;left:max(16px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;align-items:center;gap:6px;max-width:calc(100% - 140px);z-index:3}
#vbar button{background:var(--panel);backdrop-filter:blur(8px);font-weight:600}#vbar button.on{background:var(--accent);color:var(--accent-fg)}
#vtitle{display:flex;flex-direction:column;padding:2px 10px;line-height:1.2}#vtitle b{font:600 15px var(--display)}#vtitle small{color:var(--mut);font-size:12px}
#sysPop,#searchPop,#quiz{top:58px;left:max(16px,env(safe-area-inset-left,0px));width:290px;max-height:calc(100% - 80px);overflow:auto;z-index:4}
#left{display:none}
@media (max-width:760px){.hbody{grid-template-columns:minmax(0,1fr)}#regions{position:static;flex-direction:row;overflow-x:auto}.reg{flex:none}.reg svg{display:none}.ctl{margin-left:0}
 #vbar{max-width:calc(100% - 82px)}#vtitle{order:9;flex-basis:100%;padding:0 2px}#sysPop,#searchPop,#quiz{top:96px;width:min(290px,calc(100% - 90px))}}
.reslist .pres{background:var(--chip)}
.chead{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}.chead>div{min-width:0}.chead button{flex:none;font-size:12px;padding:5px 9px}
#right.min{gap:0}
@media (min-width:761px) and (max-width:1150px){#right{top:58px;max-height:calc(100% - 116px)}}
.chead{cursor:grab;touch-action:none;user-select:none}#right.drag .chead{cursor:grabbing}#right.drag{box-shadow:0 10px 30px #0004}
#vbar .seg button{border-radius:0}#vbar .seg button:first-child{border-radius:6px 0 0 6px}#vbar .seg button:last-child{border-radius:0 6px 6px 0}#sysPop #femNote{font-size:12px;margin:0}
.btnlink{display:inline-block;border:1px solid var(--line);background:var(--chip);border-radius:6px;padding:6px 10px;color:inherit;text-decoration:none;font-weight:600}.btnlink:hover{border-color:var(--accent)}.btnlink.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
</style>
<div id="home">
  <header class="top">
    <a id="semioLink" class="btnlink" hidden>← Sémio</a>
    <div class="brand">Corpus 3D<small data-t="sub"></small></div>

</div>

Hide"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke-dasharray="3 3.2"/></svg><span data-t="hide"></span></button><button type="button" id="tUndo"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 7L4 12l5 5"/><path d="M4 12h10a5 5 0 0 1 0 10h-3"/></svg><span data-t="undo"></span></button><button type="button" id="tReset"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/></svg><span data-t="resetAll"></span></button></div>

  el.innerHTML=h;el.hidden=false;el.classList.toggle('min',cardMin);
  $('#bMin').onclick=()=>{cardMin=!cardMin;try{localStorage.setItem('corpus3d-card',cardMin?'1':'0')}catch(e){}card()};
  const c=$('#bClose');if(c)c.onclick=()=>select(null)}
(function(){const el=$('#right'),app=$('#app');let d=null;
 function place(x,y){const r=app.getBoundingClientRect(),w=el.offsetWidth,h=el.offsetHeight;x=Math.max(4,Math.min(r.width-w-4,x));y=Math.max(4,Math.min(r.height-Math.min(h,60)-4,y));
  el.style.left=x+'px';el.style.top=y+'px';el.style.right='auto';el.style.bottom='auto';el.style.maxHeight='calc(100% - '+(y+8)+'px)'}
 el.addEventListener('pointerdown',e=>{if(!e.target.closest('.chead')||e.target.closest('button'))return;const r=el.getBoundingClientRect(),a=app.getBoundingClientRect();
  d={dx:e.clientX-r.left,dy:e.clientY-r.top,ax:a.left,ay:a.top};el.setPointerCapture(e.pointerId);el.classList.add('drag');e.preventDefault()});
 el.addEventListener('pointermove',e=>{if(d)place(e.clientX-d.ax-d.dx,e.clientY-d.ay-d.dy)});
 const end=()=>{if(d){d=null;el.classList.remove('drag')}};el.addEventListener('pointerup',end);el.addEventListener('pointercancel',end);
 window.cardHome=()=>{['left','top','right','bottom','maxHeight'].forEach(k=>el.style[k]='')};
 addEventListener('resize',()=>{if(el.style.left)place(parseFloat(el.style.left),parseFloat(el.style.top))})})();
function select(m,opt){
  if(!m){S.clear();sel=null;ghost=false;isolate=null}
  else if(multi&&!(opt&&opt.reveal)){if(S.has(m)){S.delete(m);sel=[...S].pop()||null}else{S.add(m);sel=m}}
  else{S.clear();S.add(m);sel=m;if(opt&&opt.reveal){scope.add(m);ghost=true;isolate=null;sysOn[m.userData.s]=true;syncLayers()}}
  refresh();card();if(m&&opt&&opt.fly)focus([m])}
function snap(){return{h:new Set(hidden),i:isolate&&new Set(isolate),g:ghost,s:Object.assign({},sysOn),S:[...S],sel:sel}}
function push(){hist.push(snap());if(hist.length>40)hist.shift()}
function undo(){const x=hist.pop();if(!x)return;hidden.clear();x.h.forEach(m=>hidden.add(m));isolate=x.i;ghost=x.g;Object.assign(sysOn,x.s);S.clear();x.S.forEach(m=>S.add(m));sel=x.sel;syncLayers();refresh();card()}
function resetAll(){if(!cur)return;cardHome();hist.length=0;hidden.clear();isolate=null;ghost=false;S.clear();sel=null;multi=false;SYS.forEach(s=>{sysOn[s[0]]=cur.sys.indexOf(s[0])>=0});rescope();syncLayers();refresh();card();fit(false)}
function bar(){const n=S.size;$('#tGhost').disabled=!n;$('#tIso').disabled=!n;$('#tHide').disabled=!n;$('#tUndo').disabled=!hist.length;
  $('#tGhost').classList.toggle('on',ghost);$('#tIso').classList.toggle('on',!!isolate);$('#tMulti').classList.toggle('on',multi);$('#tMulti').setAttribute('aria-pressed',multi)}
$('#tGhost').onclick=()=>{push();ghost=!ghost;isolate=null;refresh()};
$('#tIso').onclick=()=>{push();isolate=isolate?null:new Set(S);ghost=false;refresh()};
$('#tHide').onclick=()=>{push();S.forEach(m=>hidden.add(m));S.clear();sel=null;refresh();card()};
$('#tCenter').onclick=()=>{if(S.size)focus([...S]);else fit(false,null)};
$('#tMulti').onclick=()=>{multi=!multi;bar()};
$('#tUndo').onclick=undo;$('#tReset').onclick=resetAll;
function closePops(except){['#vpop','#sysPop','#searchPop'].forEach(s=>{if(s!==except)$(s).hidden=true});$('#tViews').classList.toggle('on',!$('#vpop').hidden);$('#bSys').classList.toggle('on',!$('#sysPop').hidden);$('#bSearch').classList.toggle('on',!$('#searchPop').hidden)}
function pop(s){$(s).hidden=!$(s).hidden;closePops(s)}
$('#tViews').onclick=()=>pop('#vpop');$('#vClose').onclick=()=>closePops();
$('#bSys').onclick=()=>pop('#sysPop');$('#bSearch').onclick=()=>{pop('#searchPop');if(!$('#searchPop').hidden)$('#q').focus()};
$('#back').onclick=()=>{location.hash='home'};
const DIRS={vAnt:[0,.08,1],vPos:[0,.08,-1],vR:[-1,.08,0],vL:[1,.08,0],vSup:[0,1,.03],vInf:[0,-1,.03]};
document.querySelectorAll('#vpop [data-d]').forEach(b=>b.onclick=()=>fly(ctl.target.clone(),cam.position.distanceTo(ctl.target),new THREE.Vector3(...DIRS[b.dataset.d])));
$('#vCenter').onclick=()=>{if(S.size)focus([...S]);else fit(false,null)};
let down=null;
cv.addEventListener('pointerdown',e=>{down=[e.clientX,e.clientY]});
cv.addEventListener('pointerup',e=>{if(!down)return;const d=Math.hypot(e.clientX-down[0],e.clientY-down[1]);down=null;if(d>6)return;
  const m=pick(e);if(mode==='q')return quizClick(m);select(m)});
let last=0;
cv.addEventListener('pointermove',e=>{if(e.pointerType!=='mouse'||e.buttons){tip(null);return}const n=performance.now();if(n-last<70)return;last=n;
  const m=pick(e);if(m!==hov){hov=m;refresh()}tip(m&&mode!=='q'?m:null,e)});
cv.addEventListener('pointerleave',()=>{if(hov){hov=null;refresh()}tip(null)});
function tip(m,e){const el=$('#tip');if(!m){el.hidden=true;return}el.textContent=label(m.userData);el.hidden=false;const r=$('#app').getBoundingClientRect();
  el.style.left=Math.min(e.clientX-r.left+14,r.width-el.offsetWidth-8)+'px';el.style.top=(e.clientY-r.top+14)+'px'}
// ---------- recherche
function results(inp,el,onPick){const q=norm(inp.value.trim());if(q.length<2){el.hidden=true;return}
  el.innerHTML='';if(!meshes.length){el.innerHTML='<div class="mut pad">'+t('loadingS')+'</div>';el.hidden=false;return}
  const ws=q.split(/\s+/),ph=PR.filter(x=>ws.every(w=>x.key.includes(w))).slice(0,6),hit=meshes.filter(m=>ws.every(w=>m.userData.key.includes(w))).sort((a,b)=>nm(a.userData).localeCompare(nm(b.userData),ST.lang)||a.userData.side.localeCompare(b.userData.side)).slice(0,50);
  if(!hit.length&&!ph.length)el.innerHTML='<div class="mut pad">'+t('noRes')+'</div>';
  ph.forEach(x=>{const b=document.createElement('button');b.type='button';b.className='pres';const fr=ST.lang==='fr';b.innerHTML='<b>'+esc(fr?x.fr:x.en)+'</b>'+((fr?x.sfr:x.sen)?' · '+esc(fr?x.sfr:x.sen):'')+'<small>'+t('model3d')+'</small>';b.onclick=()=>{el.hidden=true;closePops();go(x.id)};el.appendChild(b)});
  hit.forEach(m=>{const b=document.createElement('button');b.type='button';b.innerHTML=esc(label(m.userData))+'<small>'+esc(alt(m.userData))+' · '+esc(sysLabel(m.userData.s))+'</small>';b.onclick=()=>onPick(m);el.appendChild(b)});el.hidden=false}
const sw=m=>{if(m.userData.sex&&m.userData.sex!==ST.sex){ST.sex=m.userData.sex;save();applyUI()}};
const vSearch=()=>results($('#q'),$('#res'),m=>{sw(m);push();select(m,{reveal:true,fly:true});closePops()});
const hSearch=()=>results($('#hq'),$('#hres'),m=>{$('#hres').hidden=true;sw(m);go('corps-tout');setTimeout(()=>{if(cur)select(m,{reveal:true,fly:true})},60)});
$('#q').addEventListener('input',vSearch);$('#hq').addEventListener('input',hSearch);
// ---------- quiz
let mode='x',qm=1,target=null,tries=0,good=0,asked=0,answered=true;
function setMode(m){mode=m;$('#bQuiz').classList.toggle('on',m==='q');$('#quiz').hidden=m!=='q';$('#tools').hidden=m==='q';closePops();select(null);flash=null;if(m==='q')next();else refresh()}
$('#bQuiz').onclick=()=>setMode(mode==='q'?'x':'q');
$('#qm1').onclick=()=>{qm=1;$('#qm1').classList.add('on');$('#qm2').classList.remove('on');next()};
$('#qm2').onclick=()=>{qm=2;$('#qm2').classList.add('on');$('#qm1').classList.remove('on');next()};
function pool(){return meshes.filter(m=>scope.has(m)&&sysOn[m.userData.s]&&sexOK(m.userData)&&!hidden.has(m)&&m.userData.s!=='tegu')}
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function next(){flash=null;sel=null;S.clear();ghost=false;isolate=null;const Pl=pool();$('#qfb').textContent='';$('#qfb').className='';$('#choices').innerHTML='';
  if(!Pl.length){$('#qprompt').textContent=t('needSys');$('#qhelp').textContent='';target=null;refresh();return}
  target=rnd(Pl);tries=0;answered=false;
  if(qm===1){$('#qhelp').textContent=t('help1');$('#qprompt').textContent=t('findP')+label(target.userData);refresh()}
  else{$('#qhelp').textContent=t('help2');$('#qprompt').textContent='';flash={m:target,mat:mSel};ghost=true;refresh();focus(target);
    const same=Pl.filter(m=>m.userData.s===target.userData.s&&m.userData.fr!==target.userData.fr),ch=new Map([[target.userData.fr,target]]);
    let guard=0;while(ch.size<4&&guard++<300){const c=rnd(same.length>=3?same:Pl);ch.set(c.userData.fr,c)}
    [...ch.values()].sort(()=>Math.random()-.5).forEach(c=>{const b=document.createElement('button');b.type='button';b.textContent=nm(c.userData);b.dataset.k=c.userData.fr;
      b.onclick=()=>{if(answered)return;answered=true;asked++;const ok=c.userData.fr===target.userData.fr;if(ok)good++;b.classList.add(ok?'good':'wrong');
        if(!ok)[...$('#choices').children].find(x=>x.dataset.k===target.userData.fr).classList.add('good');fb(ok,ok?t('good'):t('answer')+label(target.userData));score()};
      $('#choices').appendChild(b)})}}
function fb(ok,s){const e=$('#qfb');e.textContent=s;e.className=ok?'ok':'bad'}
function score(){$('#score').textContent=good+' / '+asked}
function reveal(){if(!target)return;flash={m:target,mat:mOk};ghost=true;refresh();focus(target)}
function quizClick(m){if(qm!==1||answered||!target||!m)return;
  if(m.userData.fr===target.userData.fr){answered=true;asked++;if(tries===0)good++;target=m;flash={m:m,mat:mOk};refresh();fb(true,tries?t('after')(tries+1):t('first'));score()}
  else{tries++;flash={m:m,mat:mBad};refresh();fb(false,t('thisIs')(label(m.userData)));setTimeout(()=>{if(flash&&flash.m===m){flash=null;refresh()}},900)}}
$('#qnext').onclick=next;$('#qshow').onclick=()=>{if(!target)return;if(!answered){answered=true;asked++;score()}fb(false,t('answer')+label(target.userData));reveal()};
// ---------- langue, sexe, thème
function isDark(){return root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches}
function applyUI(){root.lang=ST.lang;document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=t(e.dataset.t)});document.querySelectorAll('#tools button').forEach(b=>{b.title=b.querySelector('span').textContent});
  $('#q').placeholder=t('search');$('#hq').placeholder=t('hsearch');cv.setAttribute('aria-label',t('cv'));$('#theme').textContent=isDark()?t('light'):t('dark');
  $('#lgFR').classList.toggle('on',ST.lang==='fr');$('#lgEN').classList.toggle('on',ST.lang==='en');
  $('#sexM').classList.toggle('on',ST.sex==='M');$('#sexF').classList.toggle('on',ST.sex==='F');$('#femNote').hidden=ST.sex!=='F';
  if(cur){const fr=ST.lang==='fr';$('#vtitle b').textContent=fr?cur.fr:cur.en;$('#vtitle small').textContent=fr?cur.sfr:cur.sen;syncLayers();counts();card();if(mode==='q')next()}else renderHome()}
